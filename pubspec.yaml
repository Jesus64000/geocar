name: geocar
description: "A new Flutter project for workshop geolocation."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Dependencias TestingCode (Sprint 0) ---
  # Backend y Base de Datos (Firebase)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Geolocalización y Mapas
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Utilidades UI
  shared_preferences: ^2.2.3 # Para guardar sesiones offline

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true